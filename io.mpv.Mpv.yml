      - --enable-libtheora
      - --enable-libv4l2
      - --enable-libvorbis
      - --enable-libvpx
      - --enable-libx264
      - --enable-libx265
      - --enable-libwebp
      - --enable-libsmbclient
      - --enable-libxml2
      - --enable-vulkan
      - --enable-libdrm
      - --enable-vaapi

    sources:
