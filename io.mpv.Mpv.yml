id: io.mpv.Mpv
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mpv-wrapper
rename-desktop-file: mpv.desktop
rename-appdata-file: mpv.metainfo.xml
rename-icon: mpv

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --filesystem=/tmp:rw
  - --filesystem=xdg-pictures:rw
  - --filesystem=xdg-videos:rw
  - --filesystem=home/.var/app/io.mpv.Mpv/config/mpv/scripts:create
  - --filesystem=host:ro
  - --env=LC_NUMERIC=C
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-run/pipewire-0:ro

#  mpris support via dbus
  - --own-name=org.mpris.MediaPlayer2.mpv.*
  - --talk-name=org.gnome.SessionManager

cleanup:
  - '*.la'
  - '*.a'

modules:
  - modules/mpv.yaml

  # flatpak mpv customizations
  - name: mpv-custom
    buildsystem: simple
    build-commands:
      - install -Dm755 mpv-wrapper.sh /app/bin/mpv-wrapper
      - install -Dm644 mpv.conf /app/etc/mpv/mpv.conf
    sources:
      - type: file
        path: mpv-wrapper.sh

      # default config
      - type: inline
        dest-filename: mpv.conf
        contents: |
          # save screenshots to xdg-pictures/mpv
          screenshot-dir=~/.var/app/io.mpv.Mpv/Pictures/mpv

  - modules/plugins.yaml

  - modules/python-modules.yaml

  - modules/utilities.yaml

  - modules/yt-dlp.yaml
