      - -Ddvdnav=enabled
      - -Degl-drm=enabled
      - -Degl-wayland=enabled
      - -Degl-x11=enabled
      - -Degl=enabled
      - -Dgbm=enabled
      - -Dgl-x11=enabled
      - -Dgl=enabled
      - -Diconv=enabled
      - -Djack=enabled
      - -Djavascript=enabled
      - -Djpeg=enabled
      - -Dlcms2=enabled
      - -Dlibarchive=enabled
      - -Dlibavdevice=enabled
      - -Dlibbluray=enabled
      - -Dlibmpv=true
      - -Dlua=enabled
      - -Dopenal=enabled
      - -Dpipewire=enabled
      - -Dplain-gl=enabled
      - -Dpulse=enabled
      - -Drubberband=enabled
      - -Duchardet=enabled
      - -Dvaapi-drm=enabled
      - -Dvaapi-wayland=enabled
      - -Dvaapi-x11=enabled
      - -Dvaapi=enabled
      - -Dvapoursynth=enabled
      - -Dvdpau-gl-x11=enabled
      - -Dvdpau=enabled
      - -Dvector=enabled
      - -Dvulkan=enabled
      - -Dwayland=enabled
      - -Dwerror=false
      - -Dx11=enabled
      - -Dxv=enabled
      - -Dzimg=enabled
      - -Dzlib=enabled
    post-install:
      - sed  '/^X-KDE-Protocols/s/,smb//; /^X-KDE-Protocols/s/smb,//; /^X-KDE-Protocols/s/smb//; /^X-KDE-Protocols=$/d' -i /app/share/applications/mpv.desktop
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/mpv-player/mpv/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          timestamp-query: .published_at

      # replace upstream metainfo file with custom one
      - type: file
        path: io.mpv.Mpv.metainfo.xml
        dest: etc/
        dest-filename: mpv.metainfo.xml

  # flatpak mpv customizations
  - name: mpv-custom
    buildsystem: simple
    build-commands:
      - install -Dm755 mpv-wrapper.sh /app/bin/mpv-wrapper
      - install -Dm644 mpv.conf /app/etc/mpv/mpv.conf
    sources:
      - type: file
        path: mpv-wrapper.sh

      # default config
      - type: inline
        dest-filename: mpv.conf
        contents: |
          # save screenshots to xdg-pictures/mpv
          screenshot-dir=~/.var/app/io.mpv.Mpv/Pictures/mpv

  - modules/plugins.yaml

  - modules/python-modules.yaml

  - modules/utilities.yaml
