name: ffmpeg
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/ffmpeg/examples
config-opts:
  - --disable-debug
  - --disable-doc
  - --disable-static
  - --enable-encoder=png
  - --enable-gnutls
  - --enable-gpl
  - --enable-shared
  - --enable-version3
  - --enable-libaom
  - --enable-libass
  - --enable-libbs2b
  - --enable-libdav1d
  - --enable-libfreetype
  - --enable-libmp3lame
  - --enable-libopus
  - --enable-libjxl
  - --enable-libmysofa
  - --enable-libtheora
  - --enable-libv4l2
  - --enable-libvorbis
  - --enable-libvpx
  - --enable-libx264
  - --enable-libx265
  - --enable-libwebp
  - --enable-libsmbclient
  - --enable-libxml2
  - --enable-vulkan
  - --enable-libdrm
  - --enable-vaapi

sources:
  - type: git
    url: https://git.ffmpeg.org/ffmpeg.git
    commit: 74e4393595cf2b5857f0da925c4e0dd74ea306e5
    tag: n9.1
    x-checker-data:
      type: git
      tag-pattern: ^n([\d.]{3,7})$

modules:
  - name: smbclient
    config-opts:
      - --without-json
      - --without-ad-dc
      - --without-ldap
      - --without-ads
      - --without-pam
      - --disable-python
      - --disable-cups
      - --disable-iprint
      - --without-systemd
      - --bindir=.
      - --sbindir=.
      - --sysconfdir=.
    cleanup:
      - /lib/perl5
    build-options:
      env:
        PERL5LIB: /app/lib/perl5
    buildsystem: autotools
    sources:
      - type: archive
        archive-type: tar
        url: https://download.samba.org/pub/samba/stable/samba-4.25.1.tar.gz
        sha256: 7f367545bca69aa96897628f82f0f04d4b66b3bcb36cb978b9bb952c4b4c428d
        x-checker-data:
          type: html
          url: https://download.samba.org/pub/samba/stable/?C=M;O=D
          version-pattern: samba-(\d+\.\d+\.\d+).tar.gz
          url-template: https://download.samba.org/pub/samba/stable/samba-$version.tar.gz
    modules:
      - name: lmdb
        sources:
          - sha256: f3927859882eb608868c8c31586bb7eb84562a40a6bf5cc3e13b6b564641ea28
            type: archive
            url: https://github.com/LMDB/lmdb/archive/LMDB_0.9.22.tar.gz
        make-install-args:
          - prefix=/app
        no-autogen: true
        subdir: libraries/liblmdb

      - name: parse-yapp
        buildsystem: simple
        build-commands:
          - perl Makefile.PL INSTALL_BASE=/app
          - make
          - make install
        sources:
          - type: archive
            url: https://cpan.metacpan.org/authors/id/W/WB/WBRASWELL/Parse-Yapp-1.21.tar.gz
            sha256: 3810e998308fba2e0f4f26043035032b027ce51ce5c8a52a8b8e340ca65f13e5

  - name: Tesseract
    config-opts:
      - --disable-static
    modules:
      - name: leptonica
        config-opts:
          - --disable-static
          - --with-pic
        sources:
          - type: archive
            url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
            sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7
            x-checker-data:
              type: json
              url: https://api.github.com/repos/danbloomberg/leptonica/releases/latest
              version-query: .tag_name
              url-query: .assets[] | select(.name | test("^leptonica-\\Q\($version)\\E\\.tar\\.gz$")) | .browser_download_url
              timestamp-query: .published_at
        cleanup:
          - /bin
    sources:
      - type: git
        url: https://github.com/tesseract-ocr/tesseract.git
        tag: 5.5.4
        commit: 7e548e6eff172f38f97664afe7f7ce40db36c8d6
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tesseract-ocr/tesseract/releases/latest
          timestamp-query: .published_at
          tag-query: .tag_name
          version-query: .tag_name
    cleanup:
      - /bin

  - name: x264
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    config-opts:
      - --disable-cli
      - --enable-shared
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55
        # Every commit to the stable branch is considered a release
        # https://code.videolan.org/videolan/x264/-/issues/35
        x-checker-data:
          type: json
          url: https://code.videolan.org/api/v4/projects/536/repository/branches/stable
          commit-query: .commit.id
          version-query: .commit.short_id
          timestamp-query: .commit.created_at

  - name: x265
    buildsystem: cmake
    subdir: source
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://bitbucket.org/multicoreware/x265_git.git
        tag: '4.2'
        commit: e444744c03978c1fb4e037168967020cf2648427
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: libbs2b
    buildsystem: autotools
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        archive-type: tar
        url: https://downloads.sourceforge.net/sourceforge/bs2b/libbs2b-3.1.0.tar.gz
        sha256: 6aaafd81aae3898ee40148dd1349aab348db9bfae9767d0e66e0b07ddd4b2528
        x-checker-data:
          type: html
          url: https://sourceforge.net/projects/bs2b/files/libbs2b/
          version-pattern: projects/bs2b/files/libbs2b/(\d+\.\d+\.\d+)
          url-template: https://downloads.sourceforge.net/sourceforge/bs2b/libbs2b-$version.tar.gz
      # https://src.fedoraproject.org/rpms/libbs2b/blob/rawhide/f/libbs2b.spec#_40
      - type: shell
        commands:
          - sed -i -e 's/lzma/xz/g' configure.ac
          - autoreconf -vif
